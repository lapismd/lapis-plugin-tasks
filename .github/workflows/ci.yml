name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm spec:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publint
      - run: pnpm test:storybook
      - run: pnpm build-storybook
