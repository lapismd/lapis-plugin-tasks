name: CI and npm release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tasks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --prefer-offline
      - name: Guard reviewed version inputs before merge
        uses: lapismd/lapis-ci/actions/guard-version-runtime@dd71275c5b2618afceae0b97ee0a071649781971
        with:
          qualification-file: .github/versioning-runtime.json
      - name: Install the pinned Jujutsu tool
        run: node scripts/validation/install-tools.mjs --ci
      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"
      - name: Run governance checks
        run: node scripts/run-turbo.mjs ci:governance --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tasks-validation-governance-${{ github.sha }}
          path: .local/validation/runs/
          include-hidden-files: true
          if-no-files-found: warn

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --prefer-offline
      - name: Install the pinned Jujutsu tool
        run: node scripts/validation/install-tools.mjs --ci
      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"
      - name: Run type and source-style checks
        run: node scripts/run-turbo.mjs ci:quality --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tasks-validation-quality-${{ github.sha }}
          path: .local/validation/runs/
          include-hidden-files: true
          if-no-files-found: warn

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --prefer-offline
      - name: Install the pinned Jujutsu tool
        run: node scripts/validation/install-tools.mjs --ci
      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"
      - name: Run unit tests
        run: node scripts/run-turbo.mjs ci:unit --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tasks-validation-unit-${{ github.sha }}
          path: .local/validation/runs/
          include-hidden-files: true
          if-no-files-found: warn

  native:
    name: Native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --prefer-offline
      - name: Install the pinned Jujutsu tool
        run: node scripts/validation/install-tools.mjs --ci
      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"
      - name: Run native checks, tests, and build
        run: node scripts/run-turbo.mjs ci:native --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tasks-validation-native-${{ github.sha }}
          path: .local/validation/runs/
          include-hidden-files: true
          if-no-files-found: warn

  storybook-static:
    name: Static Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --prefer-offline
      - name: Install the pinned Jujutsu tool
        run: node scripts/validation/install-tools.mjs --ci
      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"
      - name: Build static Storybook
        run: node scripts/run-turbo.mjs ci:storybook-static --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tasks-validation-storybook-static-${{ github.sha }}
          path: .local/validation/runs/
          include-hidden-files: true
          if-no-files-found: warn

  storybook-interaction:
    name: Storybook interactions (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --prefer-offline
      - name: Install the pinned Jujutsu tool
        run: node scripts/validation/install-tools.mjs --ci
      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"
      - name: Run one Storybook interaction shard
        run: node scripts/run-turbo.mjs ci:storybook-interaction-${{ matrix.shard }} --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tasks-validation-storybook-interaction-${{ matrix.shard }}-${{ github.sha }}
          path: .local/validation/runs/
          include-hidden-files: true
          if-no-files-found: warn

  audit:
    name: Dependency audits
    needs:
      - governance
      - quality
      - unit
      - native
      - storybook-static
      - storybook-interaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --prefer-offline
      - name: Audit complete raw graphs under exact source-owned policy
        uses: lapismd/lapis-ci/actions/check-development-audit@63e64958e9b271d36feba06a162ee02b079a3206
        with:
          policy-file: .github/development-audit.json
      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Retain complete raw dependency audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tasks-dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/dependency-audit/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  validate:
    name: Validate
    if: always()
    needs:
      - governance
      - quality
      - unit
      - native
      - storybook-static
      - storybook-interaction
      - audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Aggregate blocking validation lanes
        env:
          GOVERNANCE: ${{ needs.governance.result }}
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          NATIVE: ${{ needs.native.result }}
          STORYBOOK_STATIC: ${{ needs.storybook-static.result }}
          STORYBOOK_INTERACTION: ${{ needs.storybook-interaction.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          results=(
            "$GOVERNANCE"
            "$QUALITY"
            "$UNIT"
            "$NATIVE"
            "$STORYBOOK_STATIC"
            "$STORYBOOK_INTERACTION"
            "$AUDIT"
          )
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "A required Tasks validation lane finished with: $result" >&2
              exit 1
            fi
          done
          echo "All blocking Tasks validation lanes passed."
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --prefer-offline
      - name: Install the pinned Jujutsu tool
        run: node scripts/validation/install-tools.mjs --ci
      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"
      - name: Prepare the immutable npm artifact
        run: node scripts/run-turbo.mjs ci:release-prepare --summarize
      - name: Report Turbo cache
        run: node scripts/report-turbo-cache.mjs --github-summary
      - name: Collect the qualified immutable npm artifact
        run: |
          mkdir .release
          cp .local/validation/runs/*/.release/* .release/
      - name: Upload the qualified npm artifact
        uses: actions/upload-artifact@v7
        with:
          name: tasks-npm-${{ github.sha }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tasks-validation-validate-${{ github.sha }}
          path: .local/validation/runs/
          include-hidden-files: true
          if-no-files-found: warn

  changesets:
    name: Version packages
    needs: validate
    if: github.repository == 'lapismd/lapis-plugin-tasks' && needs.validate.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hasChangesets: ${{ steps.intent.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      - name: Guard qualified version runtime
        uses: lapismd/lapis-ci/actions/guard-version-runtime@dd71275c5b2618afceae0b97ee0a071649781971 # reviewed whole-recipe proof
        with:
          qualification-file: .github/versioning-runtime.json
      - name: Determine genuine package version intent
        id: intent
        run: node scripts/version-intent.mjs
      - name: Mint repository-scoped version PR token
        id: app
        if: steps.intent.outputs.hasChangesets == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - id: changesets
        if: steps.intent.outputs.hasChangesets == 'true'
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm release:version
          commitMode: github-api
          createGithubReleases: false
          title: "chore: version Tasks package"
          commit: "chore: version Tasks package"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  publish:
    name: Publish and verify npm release
    needs: [validate, changesets]
    if: github.ref == 'refs/heads/main' && needs.changesets.outputs.hasChangesets != 'true'
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies and current npm
        run: |
          pnpm install --frozen-lockfile --ignore-pnpmfile
          npm install --global npm@12.0.2
      - name: Prepare source-pinned registry installation readiness
        uses: lapismd/lapis-ci/actions/setup-registry-readiness@c9fed365342109997587bd9a5a3b63066e8373aa
      - uses: actions/download-artifact@v8
        with:
          name: tasks-npm-${{ github.sha }}
          path: .release
      - name: Sign and verify npm-compatible provenance for the qualified artifact
        run: pnpm release:attest
      - name: Check inherited release credentials without exposing them
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm whoami --registry=https://registry.npmjs.org
          else
            echo "No inherited token; npm will use the configured trusted publisher."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm release:publish
        env:
          LAPIS_TASKS_RELEASE_APPROVED: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tasks-registry-receipt-${{ github.sha }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
  notify-dependencies:
    name: Notify dependency consumers
    needs:
      - publish
    if: always() && needs.publish.result == 'success'
    permissions:
      contents: read
    uses: lapismd/dependency-automation/.github/workflows/notify.yml@ea9d35b12b612467bbabf1c6271ffa41b5eda4ba
    with:
      automation-ref: ea9d35b12b612467bbabf1c6271ffa41b5eda4ba
      source-sha: ${{ github.sha }}
    secrets:
      app-private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
