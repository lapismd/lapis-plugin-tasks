name: Publish Storybook to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

defaults:
  run:
    shell: bash

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-pnpmfile

      - name: Install the pinned Jujutsu tool
        run: node scripts/validation/install-tools.mjs --ci

      - name: Select the exact CI source revision
        run: |
          jj git init --colocate .
          jj --ignore-immutable edit "$GITHUB_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build static Storybook
        run: pnpm build-storybook

      - name: Verify complete static Storybook
        run: |
          set -euo pipefail
          mapfile -t runs < <(find .local/validation/runs -mindepth 1 -maxdepth 1 -type d)
          test "${#runs[@]}" -eq 1
          rm -rf storybook-static
          cp -a "${runs[0]}/storybook-static" storybook-static
          test -f storybook-static/index.html
          test -f storybook-static/iframe.html
          test -f storybook-static/index.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

  deploy:
    name: Deploy static Storybook
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
