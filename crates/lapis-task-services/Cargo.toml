[package]
name = "lapis-task-services"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false
description = "Transport-independent native algorithms owned by the Lapis Tasks plugin"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1.12.3"
rrule = "=0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "=0.9.34"
saphyr = { version = "=0.3.0", default-features = false }
ryu-js = "=1.0.2"

[workspace]
