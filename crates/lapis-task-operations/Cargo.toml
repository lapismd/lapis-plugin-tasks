[package]
name = "lapis-task-operations"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
lapis-app-core = { git = "https://github.com/lapismd/lapis-server", rev = "09f07463369e5b09a65f0b753caf639ea9f197f0" }
lapis-app-protocol = { git = "https://github.com/lapismd/lapis-server", rev = "09f07463369e5b09a65f0b753caf639ea9f197f0" }
lapis-task-services = { path = "../lapis-task-services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.3"
tokio = { version = "1", features = ["rt"] }
uuid = "1"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
